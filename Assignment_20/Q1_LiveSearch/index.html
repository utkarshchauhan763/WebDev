<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Real-Time Live Search</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .search-box {
      position: relative;
      margin-bottom: 30px;
    }
    #searchInput {
      width: 100%;
      padding: 15px 50px 15px 20px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 10px;
      transition: all 0.3s;
    }
    #searchInput:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .search-icon {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 20px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 18px;
      font-weight: 600;
    }
    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s;
      border: 2px solid transparent;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      border-color: #667eea;
    }
    .product-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .product-name {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }
    .product-price {
      font-size: 20px;
      font-weight: 700;
      color: #667eea;
    }
    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .no-results-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }
    .no-results-text {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .no-results-subtitle {
      font-size: 14px;
      color: #bbb;
    }
    .results-count {
      margin-bottom: 20px;
      color: #666;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Real-Time Live Search</h1>
    <p class="subtitle">Search for products using jQuery AJAX</p>

    <div class="search-box">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Type to search products (e.g., iPhone, Samsung, Camera)..."
        autocomplete="off"
      >
      <span class="search-icon">🔍</span>
    </div>

    <div class="results-count" id="resultsCount" style="display: none;"></div>

    <div id="loadingIndicator" class="loading" style="display: none;">
      <div class="spinner"></div>
      Searching products...
    </div>

    <div id="searchResults" class="products-grid"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
