<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5 - Movie Ticket Booking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .header h1 {
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .form-container {
            padding: 2rem;
        }
        
        .movie-info {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #2c3e50;
        }
        
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        
        .valid {
            border-color: #27ae60 !important;
            background-color: #eafaf1;
        }
        
        .invalid {
            border-color: #e74c3c !important;
            background-color: #fdf2f2;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
        
        .success-message {
            color: #27ae60;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
        
        .book-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        
        .book-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.4);
        }
        
        .book-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }
        
        .ticket-display {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: white;
            padding: 2rem;
            margin-top: 2rem;
            border-radius: 10px;
            display: none;
        }
        
        .ticket-display.show {
            display: block;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .ticket-header {
            text-align: center;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        
        .ticket-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .ticket-field {
            text-align: center;
        }
        
        .ticket-field strong {
            display: block;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 0.25rem;
        }
        
        .ticket-value {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .seat-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .seat {
            width: 40px;
            height: 40px;
            border: 2px solid #3498db;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .seat.available {
            background: white;
            color: #3498db;
        }
        
        .seat.selected {
            background: #3498db;
            color: white;
        }
        
        .seat:hover {
            transform: scale(1.1);
        }
        
        @media (max-width: 600px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .form-container {
                padding: 1rem;
            }
            
            .ticket-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Movie Ticket Booking</h1>
            <p>Book your favorite movie tickets instantly</p>
        </div>
        
        <div class="form-container">
            <div class="movie-info">
                <h3>🍿 Now Showing: "The Amazing Adventure"</h3>
                <p>Duration: 2h 30min | Rating: PG-13 | Price: ₹250 per seat</p>
            </div>

            <form id="bookingForm">
                <div class="form-group">
                    <label for="customerName">Full Name</label>
                    <input type="text" id="customerName" name="customerName" placeholder="Enter your full name">
                    <div class="error-message" id="nameError"></div>
                    <div class="success-message" id="nameSuccess">✓ Valid name</div>
                </div>

                <div class="form-group">
                    <label for="customerEmail">Email Address</label>
                    <input type="email" id="customerEmail" name="customerEmail" placeholder="your@email.com">
                    <div class="error-message" id="emailError"></div>
                    <div class="success-message" id="emailSuccess">✓ Valid email</div>
                </div>

                <div class="form-group">
                    <label for="seatCount">Number of Seats (1-10)</label>
                    <select id="seatCount" name="seatCount">
                        <option value="">Select number of seats</option>
                        <option value="1">1 Seat</option>
                        <option value="2">2 Seats</option>
                        <option value="3">3 Seats</option>
                        <option value="4">4 Seats</option>
                        <option value="5">5 Seats</option>
                        <option value="6">6 Seats</option>
                        <option value="7">7 Seats</option>
                        <option value="8">8 Seats</option>
                        <option value="9">9 Seats</option>
                        <option value="10">10 Seats</option>
                    </select>
                    <div class="error-message" id="seatsError"></div>
                    <div class="success-message" id="seatsSuccess">✓ Valid seat selection</div>
                </div>

                <div class="form-group">
                    <label>Show Time</label>
                    <select id="showTime" name="showTime">
                        <option value="">Select show time</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="1:00 PM">1:00 PM</option>
                        <option value="4:00 PM">4:00 PM</option>
                        <option value="7:00 PM">7:00 PM</option>
                        <option value="10:00 PM">10:00 PM</option>
                    </select>
                    <div class="error-message" id="timeError"></div>
                    <div class="success-message" id="timeSuccess">✓ Show time selected</div>
                </div>

                <button type="submit" class="book-btn" id="bookBtn" disabled>
                    🎫 Book Tickets
                </button>
            </form>

            <div class="ticket-display" id="ticketDisplay">
                <div class="ticket-header">
                    <h2>🎫 Your Movie Ticket</h2>
                    <p>Present this at the cinema</p>
                </div>
                <div class="ticket-details" id="ticketDetails">
                    <!-- Ticket details will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script src="q5_movie_ticket_booking.js"></script>
</body>
</html>
