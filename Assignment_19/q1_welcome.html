<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Welcome Page Greeting</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 15px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 32px;
    }
    #greeting {
      font-size: 28px;
      font-weight: 600;
      color: #667eea;
      margin: 30px 0;
      padding: 20px;
      background: #f0f4ff;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    #greeting:hover {
      transform: scale(1.02);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }
    #welcomeMessage {
      background: #e3f2fd;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
      color: #1565c0;
      font-size: 16px;
      line-height: 1.6;
    }
    .btn-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 30px;
    }
    button {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      color: white;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .btn-secondary {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .icon {
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 Welcome Page</h1>
    
    <div id="greeting"></div>
    
    <div id="welcomeMessage">
      Welcome to our website! We're glad to have you here. Explore our features and enjoy your stay.
    </div>
    
    <div class="btn-group">
      <button id="changeGreeting" class="btn-primary">
        <span class="icon">💬</span> Change Greeting
      </button>
      <button id="toggleMessage" class="btn-secondary">
        <span class="icon">👁️</span> Toggle Welcome
      </button>
    </div>
  </div>

  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="q1_welcome.js"></script>
</body>
</html>
