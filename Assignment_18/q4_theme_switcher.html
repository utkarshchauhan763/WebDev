<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4 - Theme Switcher</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.4s ease;
    }
    
    /* Light Theme (Default) */
    body[data-theme="light"] {
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      color: #333;
    }
    
    /* Dark Theme */
    body[data-theme="dark"] {
      background: linear-gradient(135deg, #232526 0%, #414345 100%);
      color: #f0f0f0;
    }
    
    /* Blue Theme */
    body[data-theme="blue"] {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: #fff;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      transition: all 0.4s ease;
    }
    
    body[data-theme="dark"] .container {
      background: rgba(50, 50, 50, 0.95);
      color: #f0f0f0;
    }
    
    body[data-theme="blue"] .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      color: #fff;
    }
    
    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    body[data-theme="dark"] .subtitle {
      color: #aaa;
    }
    
    body[data-theme="blue"] .subtitle {
      color: rgba(255, 255, 255, 0.8);
    }
    
    .theme-buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    .theme-btn {
      flex: 1;
      min-width: 140px;
      padding: 15px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .theme-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }
    
    .theme-btn.light {
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      color: #333;
    }
    
    .theme-btn.dark {
      background: linear-gradient(135deg, #232526 0%, #414345 100%);
      color: #fff;
    }
    
    .theme-btn.blue {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: #fff;
    }
    
    .theme-btn.active {
      outline: 4px solid #ffd700;
      outline-offset: 2px;
    }
    
    .info-box {
      padding: 20px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.05);
      margin-top: 20px;
    }
    
    body[data-theme="dark"] .info-box {
      background: rgba(255, 255, 255, 0.1);
    }
    
    body[data-theme="blue"] .info-box {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .info-box h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }
    
    .info-box p {
      line-height: 1.6;
      font-size: 14px;
    }
    
    .current-theme {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 20px;
      margin-top: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body data-theme="light">
  <div class="container">
    <h1>🎨 Theme Switcher</h1>
    <p class="subtitle">Click a button to change the theme using setAttribute()</p>
    
    <div class="theme-buttons">
      <button class="theme-btn light active" data-theme="light">☀️ Light</button>
      <button class="theme-btn dark" data-theme="dark">🌙 Dark</button>
      <button class="theme-btn blue" data-theme="blue">💙 Blue</button>
    </div>
    
    <div class="info-box">
      <h3>Current Theme Information</h3>
      <p>The theme is applied using <code>setAttribute()</code> on the body element.</p>
      <p>Theme data is stored in a custom attribute: <strong>data-theme</strong></p>
      <div class="current-theme">Current: <span id="currentTheme">Light</span></div>
    </div>
  </div>

  <script>
    "use strict";

    const body = document.body;
    const themeButtons = document.querySelectorAll(".theme-btn");
    const currentThemeSpan = document.getElementById("currentTheme");

    // Apply theme using setAttribute()
    function applyTheme(themeName) {
      // Use setAttribute to set data-theme attribute
      body.setAttribute("data-theme", themeName);
      
      // Update UI
      currentThemeSpan.textContent = themeName.charAt(0).toUpperCase() + themeName.slice(1);
      
      // Update active button
      themeButtons.forEach(btn => {
        btn.classList.remove("active");
        if (btn.dataset.theme === themeName) {
          btn.classList.add("active");
        }
      });
      
      // Save to localStorage (bonus)
      localStorage.setItem("selectedTheme", themeName);
    }

    // Event listeners for theme buttons
    themeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const theme = btn.getAttribute("data-theme");
        applyTheme(theme);
      });
    });

    // Load saved theme on page load
    const savedTheme = localStorage.getItem("selectedTheme");
    if (savedTheme) {
      applyTheme(savedTheme);
    }
  </script>
</body>
</html>
