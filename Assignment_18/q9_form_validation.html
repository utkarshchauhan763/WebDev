<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q9 - Form Validation with preventDefault</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    input.error {
      border-color: #dc3545;
      background: #fff5f5;
    }
    input.success {
      border-color: #28a745;
      background: #f0fff4;
    }
    .error-message {
      color: #dc3545;
      font-size: 13px;
      margin-top: 5px;
      display: none;
      animation: shake 0.3s;
    }
    .error-message.show {
      display: block;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .requirements {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }
    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    .submit-btn:active {
      transform: translateY(0);
    }
    .success-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s;
    }
    .success-modal.show {
      display: flex;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .success-content {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      animation: slideUp 0.4s;
    }
    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .success-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .success-content h2 {
      color: #28a745;
      margin-bottom: 10px;
      font-size: 24px;
    }
    .success-content p {
      color: #666;
      margin-bottom: 25px;
    }
    .close-modal-btn {
      padding: 12px 30px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.3s;
    }
    .close-modal-btn:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Form Validation</h1>
    <p class="subtitle">Real-time validation with preventDefault()</p>
    
    <form id="validationForm" novalidate>
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" placeholder="Enter your name">
        <div class="error-message" id="nameError">Name is required</div>
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" placeholder="Enter your email">
        <div class="error-message" id="emailError">Valid email is required (must contain @)</div>
      </div>

      <div class="form-group">
        <label for="password">Password *</label>
        <input type="password" id="password" placeholder="Enter password">
        <div class="requirements">Minimum 6 characters required</div>
        <div class="error-message" id="passwordError">Password must be at least 6 characters</div>
      </div>

      <button type="submit" class="submit-btn">Submit Form</button>
    </form>
  </div>

  <!-- Success Modal -->
  <div class="success-modal" id="successModal">
    <div class="success-content">
      <div class="success-icon">✅</div>
      <h2>Form Submitted Successfully!</h2>
      <p>Your information has been received.</p>
      <button class="close-modal-btn" onclick="closeSuccessModal()">Close</button>
    </div>
  </div>

  <script>
    "use strict";

    const form = document.getElementById("validationForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const successModal = document.getElementById("successModal");

    // Real-time validation on input
    nameInput.addEventListener("input", () => validateField(nameInput, validateName));
    emailInput.addEventListener("input", () => validateField(emailInput, validateEmail));
    passwordInput.addEventListener("input", () => validateField(passwordInput, validatePassword));

    // Validate individual field
    function validateField(input, validationFunc) {
      const isValid = validationFunc(input);
      const errorElement = document.getElementById(input.id + "Error");
      
      if (isValid) {
        input.classList.remove("error");
        input.classList.add("success");
        errorElement.classList.remove("show");
      } else {
        input.classList.add("error");
        input.classList.remove("success");
        errorElement.classList.add("show");
      }
      
      return isValid;
    }

    // Validation functions
    function validateName(input) {
      return input.value.trim().length > 0;
    }

    function validateEmail(input) {
      const value = input.value.trim();
      return value.includes("@") && value.length > 3;
    }

    function validatePassword(input) {
      return input.value.length >= 6;
    }

    // Form submission with preventDefault()
    form.addEventListener("submit", (e) => {
      // ALWAYS prevent default form submission
      e.preventDefault();
      
      // Validate all fields
      const isNameValid = validateField(nameInput, validateName);
      const isEmailValid = validateField(emailInput, validateEmail);
      const isPasswordValid = validateField(passwordInput, validatePassword);
      
      // Check if all fields are valid
      if (isNameValid && isEmailValid && isPasswordValid) {
        showSuccessModal();
      } else {
        // Focus on first invalid field
        if (!isNameValid) nameInput.focus();
        else if (!isEmailValid) emailInput.focus();
        else if (!isPasswordValid) passwordInput.focus();
      }
    });

    function showSuccessModal() {
      successModal.classList.add("show");
    }

    function closeSuccessModal() {
      successModal.classList.remove("show");
      
      // Reset form
      form.reset();
      
      // Remove all validation classes
      [nameInput, emailInput, passwordInput].forEach(input => {
        input.classList.remove("error", "success");
      });
      
      document.querySelectorAll(".error-message").forEach(msg => {
        msg.classList.remove("show");
      });
    }
  </script>
</body>
</html>
